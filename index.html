<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join Official Telegram</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background: #070913;
  background-image: radial-gradient(circle at 50% 20%, #17213d 0%, #070913 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  font-family: 'Poppins', Arial, sans-serif;
}

/* मुख्य कार्ड डिझाइन */
.card-box {
  width: 100%;
  max-width: 390px;
  background: rgba(18, 24, 43, 0.7);
  border: 1px solid rgba(34, 158, 217, 0.2);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 28px;
  padding: 35px 24px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
}

/* Telegram लोगोसाठी गोल सर्कल */
.logo-circle {
  width: 75px;
  height: 75px;
  background: linear-gradient(135deg, #229ED9, #1275a7);
  border-radius: 50%;
  margin: 0 auto 20px auto;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 8px 20px rgba(34, 158, 217, 0.4);
  animation: float-logo 3s ease-in-out infinite;
}

.logo-circle svg {
  width: 38px;
  height: 38px;
  fill: #ffffff;
}

@keyframes float-logo {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.heading {
  color: #ffffff;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
}

.subtext {
  color: #94a3b8;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 28px;
}

/* प्रीमियम बटण */
.telegram-btn {
  width: 100%;
  height: 54px;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;

  background: linear-gradient(90deg, #229ED9, #0088cc);
  color: #ffffff;

  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;

  border: none;
  border-radius: 14px;

  box-shadow: 0 6px 20px rgba(34, 158, 217, 0.4);

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.2s ease;
}

.telegram-btn:active {
  transform: scale(0.97);
  box-shadow: 0 3px 10px rgba(34, 158, 217, 0.3);
}
</style>
</head>

<body>

<div class="card-box">
  <!-- Telegram SVG Vector Icon -->
  <div class="logo-circle">
    <svg viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.73-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.06-.49-.83-.27-1.49-.42-1.43-.89.03-.25.38-.51 1.08-.78 4.23-1.84 7.05-3.04 8.46-3.61 4.02-1.67 4.85-1.96 5.39-1.97.12 0 .39.03.56.17.14.12.18.28.2.4-.01.07.01.23-.03.39z"/>
    </svg>
  </div>

  <h1 class="heading">Join Our Community</h1>
  <p class="subtext">Get instant updates, exclusive offers, and direct access by joining our Telegram channel.</p>

  <button type="button" id="telegramJoin" class="telegram-btn">
    JOIN TELEGRAM NOW ➔
  </button>
</div>

<script>
(function() {
  const button = document.getElementById('telegramJoin');
  const telegramUrl = 'https://t.me/+CZR-8MabKPZmNGQ9';
  let clicked = false;

  button.addEventListener('click', function(e) {
    e.preventDefault();
    if (clicked) return;
    clicked = true;

    // Send Meta Lead Event
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
    }

    // ब्राउझर क्रॅश किंवा ब्लॉक न होऊ देता अचूक रीडायरेक्ट
    setTimeout(function() {
      window.location.href = telegramUrl;
    }, 250);

  });
})();
</script>

</body>
</html>
