
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">

<title>Join Telegram</title>

<!-- META PIXEL CODE -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;
n.push=n;
n.loaded=!0;
n.version='2.0';
n.queue=[];
t=b.createElement(e);
t.async=!0;

s=b.getElementsByTagName(e)[0];

fbq('init','1155452496925369');

<noscript>
<img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1155452496925369&ev=PageView&noscript=1">
</noscript>

<!-- END META PIXEL -->

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  background: #080b16;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 18px;
  font-family: Arial, sans-serif;
}

/* BIG TELEGRAM BUTTON */

.telegram-btn {
  width: 100%;
  max-width: 550px;
  min-height: 85px;

  padding: 22px 25px;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;

  background: linear-gradient(
    100deg,
    #229ED9,
    #0878ED
  );

  color: #ffffff;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 0.8px;

  border: none;
  border-radius: 60px;

  box-shadow: 0 10px 35px rgba(34,158,217,0.5);

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.telegram-btn:active {
  transform: scale(0.97);
}

/* SMALL MOBILE */

@media (max-width: 400px) {
  .telegram-btn {
    min-height: 78px;
    font-size: 21px;
    padding: 18px;
  }
}
</style>

</head>

<body>

<!-- ONLY TELEGRAM BUTTON -->

<button
  type="button"
  id="telegramJoin"
  class="telegram-btn"
>
  ✈ JOIN TELEGRAM NOW
</button>

<!-- META LEAD TRACKING -->

<script>
(function() {

  const button = document.getElementById('telegramJoin');

  let clicked = false;

  button.addEventListener('click', function() {

    if (clicked) return;
    clicked = true;

    // Open Telegram in a new tab
    const telegramTab = window.open('about:blank', '_blank');

    // Send Lead Event to Meta
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
    }

    // Redirect new tab to Telegram
    if (telegramTab) {
      telegramTab.location.replace(
        'https://t.me/+CZR-8MabKPZmNGQ9'
      );
    } else {
      window.location.href =
        'https://t.me/+CZR-8MabKPZmNGQ9';
    }

    setTimeout(function() {
      clicked = false;
    }, 2000);

  });

})();
</script>

</body>
</html>
