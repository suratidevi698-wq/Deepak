<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>Join Telegram</title>

<noscript>
<img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1155452496925369&ev=PageView&noscript=1">
</noscript>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #080b16;
  padding: 12px;
  font-family: Arial, sans-serif;
}

/* EXTRA LARGE TELEGRAM BUTTON */

.telegram-btn {
  width: 100%;
  max-width: 700px;
  min-height: 120px;
  padding: 30px 15px;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;

  background: linear-gradient(
    100deg,
    #229ED9,
    #0878ED
  );

  color: #ffffff;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 1px;

  border: none;
  border-radius: 70px;

  box-shadow: 0 12px 40px rgba(34,158,217,0.55);

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.telegram-btn:active {
  transform: scale(0.97);
}

@media (max-width: 400px) {
  .telegram-btn {
    min-height: 110px;
    font-size: 25px;
    gap: 12px;
  }
}
</style>
</head>

<body>

<!-- TELEGRAM BUTTON -->

<button
  type="button"
  id="telegramJoin"
  class="telegram-btn"
>
  ✈ JOIN TELEGRAM NOW
</button>

<!-- META LEAD TRACKING -->

<script>
(function() {

  const button = document.getElementById('telegramJoin');
  let clicked = false;

  button.addEventListener('click', function() {

    if (clicked) return;
    clicked = true;

    // Open new tab on user click
    const telegramTab = window.open('about:blank', '_blank');

    // Meta Lead Event
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
    }

    // Open Telegram
    if (telegramTab) {
      telegramTab.location.replace(
        'https://t.me/+CZR-8MabKPZmNGQ9'
      );
    } else {
      window.location.href =
        'https://t.me/+CZR-8MabKPZmNGQ9';
    }

    setTimeout(function() {
      clicked = false;
    }, 2000);

  });

})();
</script>

</body>
</html>
