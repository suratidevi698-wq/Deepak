<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0f1a">
<title>Join Telegram Channel</title>

<noscript>

</noscript>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background: radial-gradient(circle at center, #13182e 0%, #080b16 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* कंटेनर */
.container {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 30px 20px;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
}

.title {
  color: #ffffff;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}

.subtitle {
  color: #94a3b8;
  font-size: 14px;
  margin-bottom: 24px;
}

/* नवीन निऑन स्टाईल बटण */
.telegram-btn {
  width: 100%;
  height: 58px;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;

  background: linear-gradient(135deg, #00b4db, #0083b0);
  color: #ffffff;

  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.8px;

  border: none;
  border-radius: 16px;

  box-shadow: 0 10px 25px rgba(0, 180, 219, 0.4);

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.2s ease;
  animation: pulse-glow 2s infinite;
}

.telegram-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 30px rgba(0, 180, 219, 0.6);
}

.telegram-btn:active {
  transform: scale(0.97);
  box-shadow: 0 5px 15px rgba(0, 180, 219, 0.4);
}

/* पल्सिंग ग्लो अ‍ॅनिमेशन */
@keyframes pulse-glow {
  0% {
    box-shadow: 0 0 0 0 rgba(0, 180, 219, 0.5);
  }
  70% {
    box-shadow: 0 0 0 14px rgba(0, 180, 219, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(0, 180, 219, 0);
  }
}

.telegram-icon {
  font-size: 20px;
}
</style>
</head>

<body>

<div class="container">
  <h1 class="title">Exclusive Updates</h1>
  <p class="subtitle">Click below to join our official Telegram channel now!</p>

  <button type="button" id="telegramJoin" class="telegram-btn">
    <span class="telegram-icon">✈</span> JOIN TELEGRAM CHANNEL
  </button>
</div>

<script>
(function() {
  const button = document.getElementById('telegramJoin');
  const telegramUrl = 'https://t.me/+CZR-8MabKPZmNGQ9';
  let clicked = false;

  button.addEventListener('click', function(e) {
    e.preventDefault();
    if (clicked) return;
    clicked = true;

    // Send Meta Lead Event
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
    }

    // ब्राउझर क्रॅश किंवा ब्लॉक न होता रीडायरेक्ट करणे
    setTimeout(function() {
      window.location.href = telegramUrl;
    }, 250);

  });
})();
</script>

</body>
</html>
