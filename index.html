<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b1a">

<title>Join Our Telegram Community</title>

<!-- META PIXEL CODE -->
<script>
!function(f,b,e,v,n,t,s){
if(f.fbq)return;
n=f.fbq=function(){
n.callMethod ?
n.callMethod.apply(n,arguments) : n.queue.push(arguments)
};
if(!f._fbq)f._fbq=n;
n.push=n;
n.loaded=!0;
n.version='2.0';
n.queue=[];
t=b.createElement(e);
t.async=!0;
t.src=v;
s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)
}(window,document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

fbq('init','1155452496925369');
fbq('track','PageView');
</script>
<!-- END META PIXEL -->

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;

  font-family: Arial, sans-serif;
  color: white;

  background:
    radial-gradient(circle at 15% 15%,
    rgba(54,197,255,.20), transparent 36%),
    radial-gradient(circle at 85% 85%,
    rgba(139,92,246,.25), transparent 38%),
    #080b1a;
}

.card {
  width: 100%;
  max-width: 430px;

  padding: 40px 25px 30px;
  text-align: center;

  border: 1px solid rgba(151,177,255,.22);
  border-radius: 28px;

  background:
    linear-gradient(145deg,#18203e,#0c1025);

  box-shadow: 0 24px 80px rgba(0,0,0,.48);
}

.tag {
  display: inline-block;
  padding: 9px 15px;
  margin-bottom: 25px;

  border: 1px solid rgba(54,197,255,.35);
  border-radius: 30px;

  color: #a8e7ff;
  background: rgba(54,197,255,.08);

  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
}

.logo-wrap {
  width: 140px;
  height: 140px;
  margin: 0 auto 25px;
  padding: 5px;

  border-radius: 50%;

  background:
    linear-gradient(135deg,#36c5ff,#8b5cf6,#e879f9);

  box-shadow: 0 0 35px rgba(54,197,255,.3);
}

.logo {
  width: 100%;
  height: 100%;

  object-fit: cover;

  border: 4px solid #11162d;
  border-radius: 50%;
}

h1 {
  margin-bottom: 14px;
  font-size: 30px;
  font-weight: 900;
}

h1 span {
  color: #66d5ff;
}

.description {
  margin-bottom: 28px;

  color: #b8c1dc;
  font-size: 14px;
  line-height: 1.7;
}

.join-btn {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;

  width: 100%;
  min-height: 58px;
  padding: 15px;

  border: none;
  border-radius: 15px;

  color: #07101f;

  background:
    linear-gradient(100deg,#49d5ff,#8d8bff,#bd83ff);

  box-shadow: 0 10px 28px rgba(69,157,255,.28);

  font-size: 15px;
  font-weight: 900;
  text-decoration: none;

  cursor: pointer;
  transition: .2s;
}

.join-btn:hover {
  box-shadow: 0 10px 35px rgba(69,157,255,.5);
}

.join-btn:active {
  transform: scale(.97);
}

.hint {
  margin-top: 17px;
  color: #8792b2;
  font-size: 12px;
}

.footer {
  margin-top: 30px;
  padding-top: 20px;

  border-top: 1px solid rgba(151,177,255,.13);

  color: #7f8aa9;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 2px;
}

@media(max-width:380px) {
  .card {
    padding: 32px 20px 25px;
  }

  .logo-wrap {
    width: 125px;
    height: 125px;
  }

  h1 {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<main class="card">

  <div class="tag">
    ✦ OFFICIAL COMMUNITY ✦
  </div>

  <div class="logo-wrap">
    <img
      class="logo"
      src="https://i.postimg.cc/yNZPpc3p/F92D9E80-9F85-4779-ADAA-188FED17F989.jpg"
      alt="Community Logo">
  </div>

  <h1>
    JOIN OUR <span>TELEGRAM</span>
  </h1>

  <p class="description">
    Become a part of our official community.
    Join Telegram to receive the latest updates
    and announcements.
  </p>

  <!-- TELEGRAM BUTTON -->
  <a
    class="join-btn"
    id="joinTelegram"
    href="https://t.me/+CZR-8MabKPZmNGQ9"
    target="_blank"
    rel="noopener noreferrer">

    ✈ JOIN TELEGRAM NOW

  </a>

  <p class="hint">
    Click above to continue to Telegram
  </p>

  <div class="footer">
    OFFICIAL TELEGRAM COMMUNITY
  </div>

</main>

<!-- NOSCRIPT PIXEL -->
<noscript>
<img
  height="1"
  width="1"
  style="display:none"
  src="https://www.facebook.com/tr?id=1155452496925369&ev=PageView&noscript=1"
  alt="">
</noscript>

<!-- BUTTON TRACKING -->
<script>
(function () {

  const button = document.getElementById("joinTelegram");

  if (!button) return;

  let clicked = false;

  button.addEventListener("click", function () {

    if (clicked) return;

    clicked = true;

    if (typeof window.fbq === "function") {

      // Standard Meta Lead Event
      window.fbq("track", "Lead");

      // Custom Telegram Click Event
      window.fbq(
        "trackCustom",
        "TelegramJoinClick"
      );

    }

  });

})();
</script>

</body>
</html>
