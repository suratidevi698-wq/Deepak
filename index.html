</noscript>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background: #080b16;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  font-family: Arial, sans-serif;
}

/* Chrome आणि मोबाईल ब्राउझरसाठी परफेक्ट साईझ */
.telegram-btn {
  width: 100%;
  max-width: 380px; /* क्रोम किंवा डेस्कटॉपवर बटण फार मोठे पसरणार नाही */
  height: 56px;     /* स्टँडर्ड टच साईझ */

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;

  background: linear-gradient(90deg, #229ED9, #168AC5);
  color: #ffffff;

  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.5px;

  border: none;
  border-radius: 28px; /* गोल कोपरे */

  box-shadow: 0 6px 20px rgba(34, 158, 217, 0.4);

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.telegram-btn:active {
  transform: scale(0.96);
  box-shadow: 0 3px 10px rgba(34, 158, 217, 0.3);
}
</style>
</head>

<body>

<button type="button" id="telegramJoin" class="telegram-btn">
  ✈ JOIN TELEGRAM NOW
</button>

<script>
(function() {
  const button = document.getElementById('telegramJoin');
  const telegramUrl = 'https://t.me/+CZR-8MabKPZmNGQ9';
  let clicked = false;

  button.addEventListener('click', function(e) {
    e.preventDefault();
    if (clicked) return;
    clicked = true;

    // Send Meta Lead Event
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
    }

    // क्रोम आणि मोबाईलवर पॉप-अप ब्लॉकरचा त्रास न होऊ देता अचूक रीडायरेक्ट
    setTimeout(function() {
      window.location.href = telegramUrl;
    }, 250);

  });
})();
</script>

</body>
</html>
