<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>Join Telegram</title>

<noscript>
<img height="1" width="1" style="display:none"

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  background: #080b16;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
}

.telegram-btn {
  width: 100%;
  max-width: 400px;
  height: 60px;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;

  background: linear-gradient(90deg,#229ED9,#168AC5);
  color: #fff;

  font-size: 18px;
  font-weight: 800;

  border: none;
  border-radius: 50px;

  box-shadow: 0 8px 25px rgba(34,158,217,.35);

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.telegram-btn:active {
  transform: scale(.97);
}
</style>
</head>

<body>

<button type="button" id="telegramJoin" class="telegram-btn">
  ✈ JOIN TELEGRAM NOW
</button>

<script>
(function() {

  const button = document.getElementById('telegramJoin');

  let clicked = false;

  button.addEventListener('click', function() {

    if (clicked) return;
    clicked = true;

    // Open new tab directly during user click
    const telegramTab = window.open('about:blank', '_blank');

    // Send Meta Lead Event
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
    }

    // Redirect new tab to Telegram
    if (telegramTab) {
      telegramTab.location.href =
        'https://t.me/+CZR-8MabKPZmNGQ9';
    } else {
      // Fallback if browser blocks popup
      window.location.href =
        'https://t.me/+CZR-8MabKPZmNGQ9';
    }

    setTimeout(function() {
      clicked = false;
    }, 2000);

  });

})();
</script>

</body>
</html>
