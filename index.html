<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Join Telegram</title>

  n.queue=[];t=b.createElement(e);t.async=!0;

  <!-- Google Fonts + Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #0a0a12, #030308);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 35px;
      width: 100%;
      max-width: 400px;
    }

    /* LIVE PULSE RINGS LOGO */
    .logo-live-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .logo-ring-container {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(145deg, #6a5cff, #3b2ee0);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      box-shadow: 0 15px 35px rgba(106, 92, 255, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.15);
      position: relative;
      z-index: 10;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: #0f0f17;
    }

    /* Expanding rings */
    .pulse-ring {
      position: absolute;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(106, 92, 255, 0.7);
      box-shadow: 0 0 15px rgba(106, 92, 255, 0.5);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulseRing 2.2s infinite ease-out;
      opacity: 0;
      z-index: 1;
    }

    .ring-1 { width: 160px; height: 160px; animation-delay: 0s; border-color: rgba(106, 92, 255, 0.8); }
    .ring-2 { width: 185px; height: 185px; animation-delay: 0.5s; border-color: rgba(106, 92, 255, 0.65); }
    .ring-3 { width: 210px; height: 210px; animation-delay: 1s; border-color: rgba(0, 198, 255, 0.55); }
    .ring-4 { width: 235px; height: 235px; animation-delay: 1.5s; border-color: rgba(106, 92, 255, 0.45); }
    .ring-5 { width: 260px; height: 260px; animation-delay: 1.9s; border-color: rgba(0, 198, 255, 0.35); }

    @keyframes pulseRing {
      0% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.92); }
      50% { opacity: 0.5; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.45); }
    }

    /* TELEGRAM BUTTON */
    .btn-telegram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(95deg, #6a5cff, #3f9eff);
      color: white;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.2rem;
      padding: 1.1rem 1.5rem;
      border-radius: 60px;
      box-shadow: 0 10px 30px rgba(106, 92, 255, 0.5);
      border: none;
      width: 100%;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-telegram i {
      font-size: 1.5rem;
    }

    .btn-telegram:active {
      transform: scale(0.97);
      box-shadow: 0 5px 15px rgba(106, 92, 255, 0.5);
    }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- LOGO WITH LIVE PULSE RINGS -->
  <div class="logo-live-wrapper">
    <div class="logo-ring-container">
      <div class="pulse-ring ring-1"></div>
      <div class="pulse-ring ring-2"></div>
      <div class="pulse-ring ring-3"></div>
      <div class="pulse-ring ring-4"></div>
      <div class="pulse-ring ring-5"></div>
      <div class="logo">
        <img src="https://i.postimg.cc/yNZPpc3p/F92D9E80-9F85-4779-ADAA-188FED17F989.jpg" alt="Logo">
      </div>
    </div>
  </div>

  <!-- TELEGRAM BUTTON WITH PIXEL LEAD EVENT -->
  <a href="https://t.me/+CZR-8MabKPZmNGQ9" id="telegramJoin" class="btn-telegram" target="_blank" rel="noopener noreferrer">
    <i class="fab fa-telegram-plane"></i> JOIN TELEGRAM NOW
  </a>
</div>

<script>
(function() {
  const button = document.getElementById('telegramJoin');
  const telegramUrl = 'https://t.me/+CZR-8MabKPZmNGQ9';
  let clicked = false;

  button.addEventListener('click', function(e) {
    e.preventDefault();
    if (clicked) return;
    clicked = true;

    // Send Meta Lead Event
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
    }

    // ब्राउझर ब्लॉक न होऊ देता अचूक रीडायरेक्ट
    setTimeout(function() {
      window.location.href = telegramUrl;
    }, 250);
  });
})();
</script>

</body>
</html>
